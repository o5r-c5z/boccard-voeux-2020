<!doctype html>
<html lang="fr" prefix="og: http://ogp.me/ns#">
    <head>
        <meta charset="utf-8">
        <meta property="og:title" content="Boccard sends you its best wishes" />
        <meta property="og:type" content="video.other" />
        <meta property="og:url" content="https://www.boccard.com/greetings/2020/" />
        <meta property="og:image" content="images/share-en.jpg" />
        <title>Boccard 2020</title>
        <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.11.2/css/all.css" integrity="sha256-46qynGAkLSFpVbEBog43gvNhfrOj+BmwXdxFgVK/Kvc=" crossorigin="anonymous" />
        <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/3.7.2/animate.css" integrity="sha256-a2tobsqlbgLsWs7ZVUGgP5IvWZsx8bTNQpzsqCSm5mk=" crossorigin="anonymous" />
        <link href="https://fonts.googleapis.com/css?family=Roboto&display=swap" rel="stylesheet">
        <link rel="stylesheet" href="css/screen.css">
    </head>

    <body>
        <div id="page">
            <div id="header">
                <div id="header_left">
                    <h1><span id="logo">Boccard</span></h1>
                </div>
                <div id="header_right">
                    <a href="#" id="video_unmute" class="on animated infinite slow flash" title="Activer le son"><i class="fas fa-volume-mute fa-7x"></i></a>
                </div>
            </div>

            <div id="video_container">
                <video id="video" poster="images/2020_B.JPG" autoplay controls playsinline preload muted>
                    <img src="images/2020_B.JPG" alt="Vidéo" />
                </video>

                <div id="video_buttons_container" class="hidden">
                    <div id="video_buttons">
                        <div id="video_replay_container">
                            <a href="#" id="video_replay">
                                <span id="video_replay_text_en">Watch again</span>
                                <br />
                                <i class="fas fa-redo-alt fa-10x"></i>
                                <br />
                                <span id="video_replay_text_fr">Revoir la vidéo</span>
                            </a>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </body>

    <script type="text/javascript" src="js/scripts.js"></script>
</html>
